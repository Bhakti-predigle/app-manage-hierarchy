<div class="container">
  <div class="container1">
    <div class="container-nav">Navigation bar</div>
    <div class="container-content">

      <div class="container-breadcrumb">
        <!-- <div class="container-breadcrumb1">BreadCrumb</div> -->
        <lib-breadcrumb></lib-breadcrumb>
        <lib-button [variant]="'contained'" [size]="'medium'" [type]="'primary'" [label]="'Create Node'">
          <mat-icon iconLeft>add</mat-icon>
        </lib-button>
      </div>
      <div>
        <div class="tab-button-group">
          <button mat-button
            [ngStyle]="{ 'background-color': selectedTab === 'manageNode' ? '#FFFFFF' : '#F0F0F0', 'color': selectedTab === 'manageNode' ? '#334053' : '#b0b0b0' }"
            (click)="selectTab('manageNode')">
            Manage Node
          </button>

          <button mat-button
            [ngStyle]="{ 'background-color': selectedTab === 'auditLogs' ? '#FFFFFF' : '#F0F0F0', 'color': selectedTab === 'auditLogs' ? '#334053' : '#b0b0b0' }"
            (click)="selectTab('auditLogs')">
            Audit Logs
          </button>
        </div>


        <div class="tab-content">

          <ng-container *ngIf="selectedTab === 'manageNode'">

            <div class="container-node_header">

              <div class="container-node_header-div">
                <div class="container-node_header1">Manage Nodes</div>
                <div class="container-node_header2">Manage node details—all in one place</div>
              </div>

              <div style="display: flex; gap: 0.5rem;">
                <lib-button [variant]="'destructive'" [size]="'medium'" [type]="'secondary'" [label]="'Delete'">
                </lib-button>
                <lib-button [variant]="'contained'" [size]="'medium'" [type]="'primary'" [label]="'Save'">
                </lib-button>

              </div>
            </div>

            <div class="container-node_details">
              <form [formGroup]="form" class="custom-form">
                <div class="form-group">
                  <div class="form-group-div">
                    <label for="nodeName" class="label-1">Node Name <span class="required">*</span></label>
                    <lib-inputs name="nodeName" [placeholder]="''" [width]="'350px'" [height]="''">
                    </lib-inputs>
                  </div>
                </div>
                <div class="form-group">
                  <div class="form-group-div">
                    <label for="description" class="label-1">Description (Optional)<span
                        class="required">*</span></label>
                      <lib-text-area [width]="'22rem'" [height]="'8rem'"  [textAreaFooter]="''"></lib-text-area>
                  </div>
                </div>
                <div class="form-group">
                  <div class="form-group-div">
                    <label for="parent" class="label-1">Parent<span class="required">*</span></label>
                    <lib-select-dropdown NavDropdown [placeholder]="'Switch Workspace'" [items]="websites">
                    </lib-select-dropdown>
                  </div>
                </div>
                <div class="form-group">
                  <div class="form-group-div">
                    <div style="display: flex; flex-direction: column;" class="label-1">
                      <label for=" nodeName">Node Icon<span class="required">*</span><span><img
                            src="../../assets/help-circle.svg" /></span></label>
                      <div>
                        <p style="font-size: small;color: #475467">This will be displayed as node icon</p>
                      </div>

                    </div>
                    <div style="display: flex;flex-direction: column;">

                      <div style="display: flex; flex-direction: column;">
                        <div style="display: flex; gap: 1rem;">
                          <div><img src="../../assets/Icon.svg" style="height: 2.5rem;" /></div>
                          <div style="display: flex; flex-direction: column; gap: 1rem;">
                            <input id="nodeName" type="text" formControlName="nodeName"
                              class="mat-input-element custom-input" style="width: 24rem; height: 5.5rem;" />

                            <!-- "or" separator -->
                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                              <hr style="flex: 1;border: 1px solid #D0D5DD;" />
                              <span style="white-space: nowrap; color: #D0D5DD;">OR</span>
                              <hr style="flex: 1;border: 1px solid #D0D5DD;" />
                            </div>

                            <!-- New input field -->
                            <p style="margin-bottom: -1rem;">Import From URL</p>
                              <div style="position: relative; width: 24rem;">
                                <input id="alternateNodeName" type="text" formControlName="alternateNodeName" class="mat-input-element custom-input"
                                  style="width: 100%; height: 2.5rem; padding-right: 3rem;" />
                                <button type="button" class="upload-button">
                                  Upload
                                </button>
                              </div>
                              </div>
                        </div>
                      </div>

                    </div>
                  </div>
                </div>
              </form>


            </div>

          </ng-container>

          <ng-container *ngIf="selectedTab === 'auditLogs'">
            <p style="padding: 20px;">Logs Content</p>
          </ng-container>
        </div>



      </div>
    </div>
  </div>
</div>
